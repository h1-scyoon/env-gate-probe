name: repoobjs
on: workflow_dispatch
jobs:
  q:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          TK: ${{ github.token }}
        run: |
          set +e
          cat > /tmp/q.json <<'EOF'
          {"query":"{ b: repository(owner:\"f82-poc-org\",name:\"blocked-repo\"){branchProtectionRules(first:5){totalCount nodes{pattern requiredApprovingReviewCount}}} d: repository(owner:\"f82-poc-org\",name:\"blocked-repo\"){deployKeys(first:5){totalCount nodes{title}}} e: repository(owner:\"f82-poc-org\",name:\"blocked-repo\"){environments(first:5){totalCount nodes{name}}} c: repository(owner:\"f82-poc-org\",name:\"blocked-repo\"){collaborators(first:5){totalCount}} r: repository(owner:\"f82-poc-org\",name:\"blocked-repo\"){rulesets(first:5){totalCount nodes{name}}} }"}
          EOF
          echo "=== BOT (non-member, permissions:{}) ==="
          curl -s -H "Authorization: bearer $TK" -H "Content-Type: application/json" --data-binary @/tmp/q.json https://api.github.com/graphql
          echo
