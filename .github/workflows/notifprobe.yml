name: notifprobe
on: workflow_dispatch
jobs:
  q:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          TK: ${{ github.token }}
        run: |
          set +e
          TID=25536338718
          echo "=== bot READ of a thread owned by h1-scyoon ==="
          curl -s -o /tmp/r.json -w "  GET  thread -> %{http_code}\n" -H "Authorization: token $TK" "https://api.github.com/notifications/threads/$TID"
          head -c 200 /tmp/r.json; echo
          echo "=== bot WRITE: mark it read ==="
          curl -s -o /tmp/w.json -w "  PATCH thread -> %{http_code}\n" -X PATCH -H "Authorization: token $TK" "https://api.github.com/notifications/threads/$TID"
          head -c 200 /tmp/w.json; echo
          echo "=== bot WRITE: mute subscription ==="
          curl -s -o /tmp/s.json -w "  PUT subscription -> %{http_code}\n" -X PUT -H "Authorization: token $TK" -d "{\"ignored\":true}" "https://api.github.com/notifications/threads/$TID/subscription"
          head -c 200 /tmp/s.json; echo
