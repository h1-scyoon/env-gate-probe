name: xrepo
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write
      pull-requests: write
      packages: write
      deployments: write
      security-events: write
      statuses: write
    steps:
      - name: cross-repo write attempts with a token scoped to THIS repo
        env:
          TK: ${{ github.token }}
        run: |
          set +e
          SELF=h1-scyoon/env-gate-probe
          OTHER=h1-scyoon/yamldos-poc
          try(){ # method path label
            C=$(curl -s -m 15 -o /tmp/o.json -w "%{http_code}" -X "$1" \
              -H "Authorization: token $TK" -H "Accept: application/vnd.github+json" \
              "https://api.github.com$2" ${3:+-d "$3"})
            echo "[$C] $1 $2  ${4}"
            if [ "$C" = "200" ] || [ "$C" = "201" ] || [ "$C" = "204" ]; then
              echo "    >>> SUCCEEDED: $(head -c 200 /tmp/o.json)"
            fi
          }
          echo "===== BASELINE: same-repo writes (must succeed) ====="
          try POST "/repos/$SELF/issues" '{"title":"selfbaseline-x1"}' "self issue"
          echo "===== CROSS-REPO writes with a token scoped to $SELF ====="
          try POST "/repos/$OTHER/issues" '{"title":"XREPO-WRITE-PROBE-9f21"}' "other issue"
          try POST "/repos/$OTHER/labels" '{"name":"xrepo-probe-9f21","color":"ededed"}' "other label"
          try POST "/repos/$OTHER/statuses/HEAD" '{"state":"success","context":"xrepo-9f21"}' "other status"
          try POST "/repos/$OTHER/deployments" '{"ref":"HEAD","environment":"xrepo9f21"}' "other deployment"
          try PATCH "/repos/$OTHER" '{"description":"XREPO-DESC-9f21"}' "other repo settings"
          try POST "/repos/$OTHER/dispatches" '{"event_type":"xrepo9f21"}' "other repo dispatch"
          echo "===== CROSS-REPO reads that should be scoped ====="
          try GET "/repos/$OTHER/actions/secrets" "" "other secrets"
          try GET "/repos/$OTHER/actions/runs" "" "other runs"
          try GET "/repos/$OTHER/actions/artifacts" "" "other artifacts"
          try GET "/repos/$OTHER/actions/caches" "" "other caches"
          echo "===== token identity ====="
          curl -s -H "Authorization: token $TK" https://api.github.com/installation/repositories | head -c 400; echo
