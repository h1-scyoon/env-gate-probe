name: depprobe
on: workflow_dispatch
jobs:
  q:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          TK: ${{ github.token }}
        run: |
          set +e
          echo "=== bot (authenticated non-member) reading the public issue's dependencies ==="
          curl -s -H "Authorization: token $TK" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/h1-scyoon/env-gate-probe/issues/4/dependencies/blocked_by | head -c 600
          echo
          echo "=== and the issue itself / timeline ==="
          curl -s -H "Authorization: token $TK" https://api.github.com/repos/h1-scyoon/env-gate-probe/issues/4/timeline | grep -c DEPSECRET
          curl -s -H "Authorization: token $TK" https://api.github.com/repos/h1-scyoon/depsecret/issues/1 -o /tmp/x -w "  direct private issue -> %{http_code}\n"
