name: envsecret
on: workflow_dispatch
jobs:
  alpha:
    runs-on: ubuntu-latest
    environment: envalpha
    steps:
      - env: {S: "${{ secrets.ENVSECRET }}"}
        run: |
          if [ "$S" = "ALPHASECRET-m71x" ]; then echo "ALPHA_JOB_GOT=alpha"; elif [ "$S" = "BRAVOSECRET-m71x" ]; then echo "ALPHA_JOB_GOT=BRAVO_LEAK"; elif [ -z "$S" ]; then echo "ALPHA_JOB_GOT=empty"; else echo "ALPHA_JOB_GOT=other"; fi
  bravo:
    runs-on: ubuntu-latest
    environment: envbravo
    steps:
      - env: {S: "${{ secrets.ENVSECRET }}"}
        run: |
          if [ "$S" = "BRAVOSECRET-m71x" ]; then echo "BRAVO_JOB_GOT=bravo"; elif [ "$S" = "ALPHASECRET-m71x" ]; then echo "BRAVO_JOB_GOT=ALPHA_LEAK"; elif [ -z "$S" ]; then echo "BRAVO_JOB_GOT=empty"; else echo "BRAVO_JOB_GOT=other"; fi
  noenv:
    runs-on: ubuntu-latest
    steps:
      - env: {S: "${{ secrets.ENVSECRET }}"}
        run: |
          if [ -z "$S" ]; then echo "NOENV_JOB_GOT=empty"; elif [ "$S" = "ALPHASECRET-m71x" ]; then echo "NOENV_JOB_GOT=ALPHA_LEAK"; elif [ "$S" = "BRAVOSECRET-m71x" ]; then echo "NOENV_JOB_GOT=BRAVO_LEAK"; else echo "NOENV_JOB_GOT=other"; fi
