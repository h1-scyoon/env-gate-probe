name: cacherestore
on: workflow_dispatch
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - id: c
        uses: actions/cache@v4
        with: {path: d, key: forkshared-key-v1}
      - run: |
          echo "cache-hit=${{ steps.c.outputs.cache-hit }}"
          if [ -f d/marker.txt ]; then echo "POISON REACHED BASE: $(cat d/marker.txt)"; else echo "isolated (no marker)"; fi
