name: orgfields3
on: workflow_dispatch
jobs:
  q:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          TK: ${{ github.token }}
          FLIST: "anyPinnableItems archivedAt avatarUrl createdAt databaseId description descriptionHTML email estimatedNextSponsorsPayoutInCents hasSponsorsListing id ipAllowListEnabledSetting ipAllowListForInstalledAppsEnabledSetting isSponsoringViewer isVerified location login membersCanForkPrivateRepositories monthlyEstimatedSponsorsIncomeInCents name newTeamResourcePath newTeamUrl notificationDeliveryRestrictionEnabledSetting organizationBillingEmail pinnedItemsRemaining projectsResourcePath projectsUrl requiresTwoFactorAuthentication resourcePath teamsResourcePath teamsUrl totalSponsorshipAmountAsSponsorInCents twitterUsername updatedAt url viewerCanAdminister viewerCanChangePinnedItems viewerCanCreateRepositories viewerCanCreateTeams viewerCanSponsor viewerIsAMember viewerIsFollowing viewerIsSponsoring webCommitSignoffRequired websiteUrl"
        run: |
          set +e
          Q="{"
          i=0
          for f in $FLIST; do
            Q="$Q a$i: organization(login: \\\"f82-poc-org\\\") { $f }"
            i=$((i+1))
          done
          Q="$Q }"
          printf '{"query":"%s"}' "$Q" > /tmp/q.json
          head -c 300 /tmp/q.json; echo
          echo "=== RESPONSE ==="
          curl -s -H "Authorization: bearer $TK" -H "Content-Type: application/json" \
            --data-binary @/tmp/q.json https://api.github.com/graphql
          echo
