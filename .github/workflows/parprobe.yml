name: parprobe
on: workflow_dispatch
jobs:
  q:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          TK: ${{ github.token }}
        run: |
          set +e
          cat > /tmp/q.json <<EOF
          {"query":"{repository(owner:\"h1-scyoon\",name:\"env-gate-probe\"){issue(number:9){title parent{title number repository{nameWithOwner isPrivate}}}}}"}
          EOF
          echo "=== BOT (authenticated non-member) reading the child issue parent ==="
          curl -s -H "Authorization: bearer $TK" -H "Content-Type: application/json" --data-binary @/tmp/q.json https://api.github.com/graphql > /tmp/o.json
          cat /tmp/o.json; echo
          echo "PARSECRET_hits=$(grep -c PARSECRET /tmp/o.json)"
          echo "parpriv_hits=$(grep -c parpriv /tmp/o.json)"
